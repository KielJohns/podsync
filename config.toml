# Podsync Configuration

[server]
port = 8080
hostname = "https://podcasts.johnsk-pods.org"
bind_address = "*"

[storage]
type = "local"

[storage.local]
data_dir = "/app/data"

[database]
badger = { truncate = true, file_io = true }

[downloader]
self_update = true
timeout = 30

# YouTube API key loaded from environment variable
[tokens]
# Key is set via PODSYNC_YOUTUBE_API_KEY environment variable

[cleanup]
keep_last = 20

# Feeds
[feeds]

  # Mo Bitar - Test channel
  [feeds.mobitar]
  url = "https://www.youtube.com/@mobitar"
  page_size = 10
  update_period = "2h"
  quality = "high"
  format = "audio"
  opml = true
  private_feed = true

  [feeds.mobitar.custom]
  title = "Mo Bitar"
  description = "Mo Bitar's YouTube channel as a podcast"
  author = "Mo Bitar"
  category = "Technology"
  lang = "en"

  [feeds.mobitar.clean]
  keep_last = 10

  # Fireship
  [feeds.fireship]
  url = "https://www.youtube.com/@Fireship"
  page_size = 10
  update_period = "2h"
  quality = "high"
  format = "audio"
  opml = true
  private_feed = true

  [feeds.fireship.custom]
  title = "Fireship"
  description = "High-intensity code tutorials"
  author = "Jeff Delaney"
  category = "Technology"
  lang = "en"

  [feeds.fireship.clean]
  keep_last = 10

  # One-off videos playlist
  [feeds.one_offs]
  url = "https://www.youtube.com/playlist?list=PLrc8-exw-gYgmYY6QpXlOUtpjrNWOYqQ7"
  page_size = 50
  update_period = "2h"
  quality = "high"
  format = "audio"
  opml = true
  private_feed = true

  [feeds.one_offs.custom]
  title = "One-Off Videos"
  description = "Individual YouTube videos collected into a podcast"
  category = "Technology"
  lang = "en"

  [feeds.one_offs.clean]
  keep_last = 20
